# Variant (b): fine-tune DINOv2 ViT-S/14 + head on images, once. Afterwards its backbone can be
# frozen and reused: configs/classifier/head_finetuned_dinov2.yaml.
# 10 epochs with cosine: the first try (30 epochs, constant lr) peaked at epoch 4, then overfitted
# and jumped around on val. ~5 min per epoch on MPS.
inherit: [ ../env/laptop.yaml ]
run: { name: clf-finetune-dinov2 }
data: { image_size: 224 }
model: { backbone: dinov2_vits14, weights: pretrained, freeze: none, head: linear }
train: { epochs: 10, schedule: cosine, lr: 1e-3, backbone_lr: 1e-5, batch_size: 32, weight_decay: 0.05, class_weighting: inverse_freq }
